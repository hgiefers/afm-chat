name: FoundationChat
options:
  bundleIdPrefix: de.hgi
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_HARDENED_RUNTIME: NO
    # Ad-hoc-Signierung, damit App-Sandbox-Entitlements auch ohne Apple-Developer-
    # Team lokal funktionieren. Für Weitergabe/Notarisierung später auf ein
    # echtes Team + CODE_SIGN_STYLE: Automatic umstellen.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

targets:
  FoundationChat:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources
    resources:
      - path: Resources/Assets.xcassets
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: FoundationChat
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "© 2026"
        NSPrincipalClass: NSApplication
        LSApplicationSupportsSecureRestorableState: true
        NSMainStoryboardFile: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.hgi.FoundationChat
        PRODUCT_NAME: FoundationChat
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_ENTITLEMENTS: Sources/App/FoundationChat.entitlements
